<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පැමිණීමේ පද්ධතිය - Cloud Connected</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">පන්ති පැමිණීමේ පද්ධතිය</h1>

        <!-- ළමයා එකතු කිරීමේ පෝරමය -->
        <div class="mb-6 bg-slate-50 p-4 rounded-lg border">
            <h2 class="text-lg font-semibold mb-3 text-slate-700">අලුත් ළමයෙක් ඇතුළත් කිරීම</h2>
            <form id="addStudentForm" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-600">ශිෂ්‍ය අංකය (ID)</label>
                    <input type="text" id="studentId" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600">නම</label>
                    <input type="text" id="studentName" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded-md font-semibold hover:bg-indigo-700 transition">Save කරන්න</button>
            </form>
        </div>

        <!-- ළමුන්ගේ ලැයිස්තුව -->
        <div>
            <h2 class="text-lg font-semibold mb-3 text-slate-700">ලියාපදිංචි ළමුන් ලැයිස්තුව (Cloud Data)</h2>
            <div id="studentList" class="space-y-2">
                <p class="text-slate-400 text-sm">දත්ත පූරණය වෙමින් පවතී...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ඔබේ Firebase Config විස්තර
        const firebaseConfig = {
            apiKey: "AIzaSyDWtZbd807Lbl-NDkHiFWij0jcowHP6eCQ",
            authDomain: "attendance-ffb99.firebaseapp.com",
            projectId: "attendance-ffb99",
            storageBucket: "attendance-ffb99.firebasestorage.app",
            messagingSenderId: "1011827234098",
            appId: "1:1011827234098:web:db30c7daf0607924f5f32b",
            measurementId: "G-TKDY181B1S"
        };

        // Firebase Initialize කිරීම
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. ළමයෙක් Submit කළ විට Firestore එකට Save කිරීම
        const form = document.getElementById('addStudentForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const sId = document.getElementById('studentId').value;
            const sName = document.getElementById('studentName').value;

            try {
                await addDoc(collection(db, "students"), {
                    studentId: sId,
                    name: sName,
                    createdAt: new Date()
                });
                alert("සාර්ථකව දත්ත සුරැකުණි!");
                form.reset();
            } catch (error) {
                console.error("දෝෂයක් සිදු විය: ", error);
                alert("දත්ත සුරැකීම අසාර්ථකයි.");
            }
        });

        // 2. Real-time දත්ත ලබාගෙන Screen එකේ පෙන්වීම
        const studentListDiv = document.getElementById('studentList');
        
        onSnapshot(collection(db, "students"), (snapshot) => {
            let html = "";
            if(snapshot.empty) {
                studentListDiv.innerHTML = `<p class="text-slate-500 text-sm">තවම ළමුන් ඇතුළත් කර නැත.</p>`;
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                html += `
                    <div class="flex justify-between items-center p-3 bg-slate-100 rounded-md border">
                        <div>
                            <span class="font-bold text-indigo-700">${data.studentId}</span> - 
                            <span class="text-slate-800">${data.name}</span>
                        </div>
                    </div>
                `;
            });
            studentListDiv.innerHTML = html;
        });
    </script>
</body>
</html>
