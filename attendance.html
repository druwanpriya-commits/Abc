<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පන්ති පැමිණීමේ සහ කළමනාකරණ පද්ධතිය</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">

    <div class="max-w-2xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
            <h1 class="text-2xl font-bold text-indigo-600">පන්ති පැමිණීමේ පද්ධතිය (Cloud Connected)</h1>
            <p class="text-sm text-slate-500 mt-1">සියලුම දත්ත දැන් Cloud එකේ Real-time සුරැකේ.</p>
        </div>

        <!-- 1. ළමුන් ලියාපදිංචි කිරීමේ කොටස -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">අලුත් ළමයෙක් ලියාපදිංචි කිරීම</h2>
            <form id="addStudentForm" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input type="text" id="studentId" placeholder="ශිෂ්‍ය අංකය (ID)" required class="p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                <input type="text" id="studentName" placeholder="ශිෂ්‍යයාගේ නම" required class="p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                <button type="submit" class="bg-indigo-600 text-white p-2 rounded-lg font-semibold hover:bg-indigo-700 transition">ළමයා එකතු කරන්න</button>
            </form>
        </div>

        <!-- 2. අතින් (Manual) පැමිණීම සටහන් කිරීම සහ සෙවීම -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">පැමිණීම සටහන් කිරීම (ID හෝ නමින් සෙවීම)</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="searchInput" placeholder="ID එක හෝ නම ටයිප් කරන්න..." class="flex-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <!-- සෙවීමේ ප්‍රතිඵල පෙන්වන තැන -->
            <div id="searchResults" class="space-y-2">
                <p class="text-slate-400 text-sm">සෙවීමට නමක් හෝ අංකයක් ටයිප් කරන්න...</p>
            </div>
        </div>

        <!-- 3. ලියාපදිංචි ළමුන්ගේ ලැයිස්තුව -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">ලියාපදිංචි ළමුන් ලැයිස්තුව</h2>
            <div id="studentList" class="space-y-2 max-h-60 overflow-y-auto">
                <p class="text-slate-400 text-sm">දත්ත පූරණය වෙමින් පවතී...</p>
            </div>
        </div>

    </div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ඔබේ Firebase Config විස්තර
        const firebaseConfig = {
            apiKey: "AIzaSyDWtZbd807Lbl-NDkHiFWij0jcowHP6eCQ",
            authDomain: "attendance-ffb99.firebaseapp.com",
            projectId: "attendance-ffb99",
            storageBucket: "attendance-ffb99.firebasestorage.app",
            messagingSenderId: "1011827234098",
            appId: "1:1011827234098:web:db30c7daf0607924f5f32b",
            measurementId: "G-TKDY181B1S"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allStudents = [];

        // Real-time ළමුන්ගේ දත්ත ලබා ගැනීම
        onSnapshot(collection(db, "students"), (snapshot) => {
            allStudents = [];
            let listHtml = "";
            
            if(snapshot.empty) {
                document.getElementById('studentList').innerHTML = `<p class="text-slate-400 text-sm">තවම ළමුන් ලියාපදිංචි කර නැත.</p>`;
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                allStudents.push({ id: doc.id, ...data });
                listHtml += `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg border">
                        <div>
                            <span class="font-bold text-indigo-600">${data.studentId}</span> - 
                            <span class="text-slate-800">${data.name}</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('studentList').innerHTML = listHtml;
        });

        // ළමයෙක් අලුතින් ඇතුළත් කිරීම
        const form = document.getElementById('addStudentForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const sId = document.getElementById('studentId').value.trim();
            const sName = document.getElementById('studentName').value.trim();

            try {
                await addDoc(collection(db, "students"), {
                    studentId: sId,
                    name: sName,
                    createdAt: new Date()
                });
                alert("ශිෂ්‍යයා සාර්ථකව ලියාපදිංචි කරන ලදී!");
                form.reset();
            } catch (error) {
                console.error("දෝෂයකි: ", error);
                alert("දත්ත සුරැකීම අසාර්ථකයි.");
            }
        });

        // නම හෝ ID එක මගින් සෙවීම සහ පැමිණීම සටහන් කිරීම
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            if(keyword === "") {
                searchResults.innerHTML = `<p class="text-slate-400 text-sm">සෙවීමට නමක් හෝ අංකයක් ටයිප් කරන්න...</p>`;
                return;
            }

            const filtered = allStudents.filter(s => 
                s.studentId.toLowerCase().includes(keyword) || s.name.toLowerCase().includes(keyword)
            );

            if(filtered.length === 0) {
                searchResults.innerHTML = `<p class="text-red-500 text-sm">එම නමට හෝ අංකයට ගැළපෙන ළමයෙක් හමු නොවීය.</p>`;
                return;
            }

            let resultHtml = "";
            filtered.forEach(s => {
                resultHtml += `
                    <div class="flex justify-between items-center p-3 bg-indigo-50 rounded-lg border border-indigo-100">
                        <div>
                            <span class="font-bold text-indigo-700">${s.studentId}</span> - 
                            <span class="text-slate-800 font-medium">${s.name}</span>
                        </div>
                        <button onclick="markAttendance('${s.studentId}', '${s.name}')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-emerald-700 transition">
                            පැමිණීම සටහන් කරන්න
                        </button>
                    </div>
                `;
            });
            searchResults.innerHTML = resultHtml;
        });

        // පැමිණීම සටහන් කර Cloud එකට යැවීමේ פונක්ශනය
        window.markAttendance = async function(sId, sName) {
            const today = new Date().toISOString().split('T')[0]; // වර්තමාන දිනය (YYYY-MM-DD)
            
            try {
                await addDoc(collection(db, "attendance"), {
                    studentId: sId,
                    name: sName,
                    date: today,
                    timestamp: new Date()
                });
                alert(sName + " ගේ පැමිණීම සාර්ථකව සටහන් විය! ✅");
                searchInput.value = "";
                searchResults.innerHTML = `<p class="text-slate-400 text-sm">සෙවීමට නමක් හෝ අංකයක් ටයිප් කරන්න...</p>`;
            } catch (error) {
                console.error("දෝෂයකි: ", error);
                alert("පැමිණීම සටහන් කිරීම අසාර්ථකයි.");
            }
        }
    </script>
</body>
</html>
