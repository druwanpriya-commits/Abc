<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ගණිතය විභාග ප්‍රතිඵල</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .teacher-photo { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #007bff; margin-bottom: 8px; }
        .ad-card { background: #fff3cd; border: 1px solid #ffeeba; text-align: left; padding: 12px 15px; border-radius: 8px; }
        .ad-title { font-weight: bold; color: #856404; font-size: 1rem; margin: 0; }
        .ad-text { color: #856404; font-size: 0.9rem; margin-top: 5px; }
        
        label { display: block; text-align: left; font-weight: bold; margin-top: 12px; color: #333; font-size: 0.88rem; }
        select, input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        button { padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 18px; font-weight: bold; }
        button:hover { background: #219150; }
        
        #result { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; text-align: center; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .grade-badge { font-size: 20px; font-weight: bold; padding: 2px 10px; border-radius: 4px; background: #27ae60; color: white; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ගුරුවරුන්ගේ විස්තර -->
    <div class="card">
        <img id="teacherImg" src="" alt="Photo" class="teacher-photo" style="display:none;">
        <h3 style="margin: 0; color: #2c3e50;">දිමුතු සර්</h3>
        <p style="margin: 3px 0 0 0; color: #7f8c8d; font-size: 0.85rem;">ගණිත අංශය</p>
    </div>

    <!-- විශේෂ නිවේදනය -->
    <div class="ad-card" id="adSection" style="display:none;">
        <p class="ad-title">🔔 විශේෂ නිවේදනය</p>
        <p class="ad-text" id="noticeText"></p>
    </div>

    <!-- ප්‍රතිඵල සෙවුම් පෝරමය -->
    <div class="card">
        <h2 style="margin-top:0; color:#2c3e50; font-size:1.3rem;">ප්‍රතිඵල පරීක්ෂාව</h2>
        
        <!-- ආයතනය තෝරන්න -->
        <label for="instituteSelect">ආයතනය තෝරන්න:</label>
        <select id="instituteSelect">
            <option value="විමංසා">විමංසා</option>
            <option value="නැණස">නැණස</option>
            <option value="විදුබිම">විදුබිම</option>
        </select>

        <!-- ශ්‍රේණිය තෝරන්න -->
        <label for="gradeSelect">ශ්‍රේණිය තෝරන්න:</label>
        <select id="gradeSelect">
            <option value="6">6 ශ්‍රේණිය</option>
            <option value="7">7 ශ්‍රේණිය</option>
            <option value="8">8 ශ්‍රේණිය</option>
            <option value="9">9 ශ්‍රේණිය</option>
            <option value="10">10 ශ්‍රේණිය</option>
            <option value="11">11 ශ්‍රේණිය</option>
        </select>

        <!-- විභාග අංකය -->
        <label for="indexInput">විභාග අංකය ඇතුළත් කරන්න:</label>
        <input type="text" id="indexInput" placeholder="උදා: 1001">

        <button onclick="checkResult()">ප්‍රතිඵල බලන්න</button>
        <div id="result"></div>
    </div>

</div>

<script>
    // ඔබගේ Apps Script Web App URL එක මෙතැනට දමන්න
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNQri-y70Kxpg_rmFlS36dgUiR43DdYdaFLk4GaPhHfcghSGRAoi8oUl6x4we7VAct/exec"; 

    window.onload = function() {
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                if(data.photoUrl) {
                    let imgTag = document.getElementById('teacherImg');
                    imgTag.src = data.photoUrl;
                    imgTag.style.display = "inline-block";
                }
                if(data.message) {
                    document.getElementById('noticeText').innerText = data.message;
                    document.getElementById('adSection').style.display = "block";
                }
            });
    };

    function checkResult() {
        let institute = document.getElementById('instituteSelect').value;
        let grade = document.getElementById('gradeSelect').value;
        let indexNo = document.getElementById('indexInput').value.trim();
        let resultDiv = document.getElementById('result');
        
        if (indexNo === "") {
            alert("කරුණාකර විභාග අංකය ඇතුළත් කරන්න!");
            return;
        }

        resultDiv.style.display = "block";
        resultDiv.className = "";
        resultDiv.innerHTML = "ප්‍රතිඵල පරීක්ෂා කරමින් පවතී...";

        fetch(`${SCRIPT_URL}?index=${encodeURIComponent(indexNo)}&institute=${encodeURIComponent(institute)}&grade=${encodeURIComponent(grade)}`)
            .then(response => response.json())
            .then(data => {
                if (data.found) {
                    resultDiv.className = "success";
                    resultDiv.innerHTML = `
                        <h3 style="margin-top:5px; color:#155724;">ප්‍රතිඵලය</h3>
                        <p><strong>විභාග අංකය:</strong> ${data.index}</p>
                        <p><strong>නම:</strong> ${data.name}</p>
                        <p><strong>විභාගය/පාඩම:</strong> ${data.lesson}</p>
                        <p><strong>ලකුණු:</strong> <span style="font-size: 22px; font-weight: bold;">${data.marks}</span></p>
                        <p><strong>සාමාර්ථය:</strong> <span class="grade-badge">${data.grade}</span></p>
                    `;
                } else {
                    resultDiv.className = "error";
                    resultDiv.innerHTML = data.error || "ඇතුළත් කළ තොරතුරු සඳහා ප්‍රතිඵල හමු නොවීය. කරුණාකර නැවත පරීක්ෂා කරන්න.";
                }
            })
            .catch(error => {
                resultDiv.className = "error";
                resultDiv.innerHTML = "පද්ධතියේ දෝෂයක් ඇත. නැවත උත්සාහ කරන්න.";
            });
    }
</script>

</body>
</html>
